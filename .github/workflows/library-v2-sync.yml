name: Library V2 sync
# #315/#333: V2・公開台帳 → 朝ポキの蔵（新着・非公開化・配信リンク・概要本文）→ 関連記事の見出し → 公開。
# 台帳は COPY清掃ロボの読み出し専用ウェブアプリ（RX-2、V2は読むだけ）から取る。変数 LIBRARY_V2_PUBLIC_CSV_URL があればそちらを使う。
# 安全装置: 非公開化20件超・公開件数20件超の減少・EP-ID重複・番組名変化で停止（library-sync-v2.mjs）。手動修正・HOLD・タイトル不一致の概要は置き換えない。
# 台帳CSVの読み出しは RX-2（2026-11-17 デプロイ版2・ウェブアプリ・冪等確認）。GASのトリガーは使わない（ALIB_AUTO_tick 等と二重にならない）。変化が無ければ何もコミットしない。
on:
  schedule:
    # #495: GitHub の定時は混雑で遅れたり飛ばされたりする（11/21〜23 は朝の回が一度も予定どおり動かなかった）。
    # 変化が無ければ何もしない作りなので、05:37〜22:37 JST の毎時37分に動かし、遅れても次の回で拾う
    - cron: '37 20-23 * * *'   # 05:37〜08:37 JST
    - cron: '52 21 * * *'      # 06:52 JST（6:41 の新着取り込みの直後。#504）
    - cron: '7,22 22 * * *'    # 07:07・07:22 JST（同上の予備）
    - cron: '37 0-13 * * *'    # 09:37〜22:37 JST
  workflow_dispatch:
    inputs:
      retry:
        description: 'やり直しの実行（自動で付く。手動では空のまま）'
        required: false
        default: ''
  push:   # 初回の全件反映を PR ブランチ上で作るため（main には PR でマージ）
    branches: ['feat/issue-333-v2-description-sync']
    paths: ['scripts/library-sync-v2.mjs', 'scripts/library-related/**', '.github/workflows/library-v2-sync.yml']
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: library-v2-sync
  cancel-in-progress: false
env:
  RX_URL: https://script.google.com/macros/s/AKfycbwwcQQkwhGaddZxXzWh_bPVGCVP4YssJ3FKQINmTUSsThsji334DfVtxpc9VlwSm8lRIg/exec
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 宇宙・蔵のアプリ版（日付版）を git の履歴から出すため（#430）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch V2 public ledger (not committed)
        env:
          CSV_URL: ${{ vars.LIBRARY_V2_PUBLIC_CSV_URL }}
        run: |
          url="${CSV_URL:-$RX_URL?type=v2PublicCsv}"
          curl -fsSL "$url" -o "$RUNNER_TEMP/v2.csv"
          head -c 200 "$RUNNER_TEMP/v2.csv" | grep -q '^EP-ID,' || { echo "V2・公開台帳の形ではない"; exit 1; }
      - name: Sync library (stops on abnormal changes)
        run: node scripts/library-sync-v2.mjs "$RUNNER_TEMP/v2.csv" | tee "$RUNNER_TEMP/report.json"
      - name: Related-article titles (RX-1)
        run: node scripts/library-related/apply-related-titles.mjs "$RX_URL?type=libraryRelated" | tee -a "$RUNNER_TEMP/report.json"
      - name: Rebuild 朝ポキの宇宙 from the synced library (does not block the library)
        id: uchu
        continue-on-error: true
        run: |
          if git diff --quiet -- public/library/data; then echo "蔵に変化なし"; exit 0; fi
          node scripts/uchu/build-uchu.mjs > "$RUNNER_TEMP/uchu.json" && node --test tests/uchu-core.test.mjs
      - run: node --test tests/library-sync-v2.test.mjs tests/library-publication-scope.test.mjs tests/library-related-titles.test.mjs tests/library-description-tidy.test.mjs tests/library-phase11.test.mjs tests/library-public.test.mjs
      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/library/data docs/audits/library-v2-sync; then echo "変化なし"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/library/data docs/audits/library-v2-sync
          # 宇宙の作り直しが成功したときだけ宇宙のデータも載せる（失敗しても蔵の公開は止めない）
          if [ "${{ steps.uchu.outcome }}" = success ]; then git add public/uchu/data; else git checkout -- public/uchu/data 2>/dev/null || true; fi
          git commit -m "data(library): V2・公開台帳と同期 $(date -u +%F)" -m "$(cat "$RUNNER_TEMP/report.json")"
          ok=0
          for n in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push retry $n"; sleep $((n * 5))
          done
          if [ "$ok" != 1 ]; then
            # #495: main と衝突した（例: 同期中に別の変更が入った）。作業を最新の main からやり直す実行を1回だけ起こす
            if [ -z "${{ github.event.inputs.retry }}" ]; then gh workflow run library-v2-sync.yml --ref main -f retry=1 && echo "最新の main からやり直す実行を起こしました"; fi
            exit 1
          fi
          if [ "$GITHUB_REF" = refs/heads/main ]; then gh workflow run pages.yml --ref main; fi
      - name: Report failure to the command-center issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/issues/337/comments -f body="【自動通知】蔵の日次同期が失敗しました（$(date -u +%FT%TZ)・${{ github.event_name }}）。記録: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
