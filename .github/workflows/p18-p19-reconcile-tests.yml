name: P18-P19 V2 reconciliation tests
on:
  push:
    paths:
      - 'scripts/ledger-v2/p18-p19-v2-reconcile.mjs'
      - 'tests/p18-p19-v2-reconcile.test.mjs'
      - '.github/workflows/p18-p19-reconcile-tests.yml'
  pull_request:
    paths:
      - 'scripts/ledger-v2/p18-p19-v2-reconcile.mjs'
      - 'tests/p18-p19-v2-reconcile.test.mjs'
      - '.github/workflows/p18-p19-reconcile-tests.yml'
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/p18-p19-v2-reconcile.test.mjs
