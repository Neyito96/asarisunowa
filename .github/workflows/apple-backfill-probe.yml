name: Apple backfill probe (read-only)
# 第43号: Apple Search 全件調査を600件前後のバッチで実行（READ ONLY。台帳・Sheets・秘密値に触れない）。
on:
  pull_request:
    paths:
      - 'docs/release/apple-batches/**'
      - 'scripts/probe-apple-search.mjs'
      - '.github/workflows/apple-backfill-probe.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run batches sequentially (stop on rate limit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in docs/release/apple-batches/batch0${BATCH_FILTER:-1}.json; do
            n=$(basename $f .json)
            node scripts/probe-apple-search.mjs $f $n-report.json compact || true
            split -b 50000 -d $n-report.json $n-part-
            for p in $n-part-*; do { echo "apple-backfill:$n:$p"; echo '```'; cat "$p"; echo; echo '```'; } > c.md; gh pr comment ${{ github.event.pull_request.number }} --body-file c.md; done
          done
