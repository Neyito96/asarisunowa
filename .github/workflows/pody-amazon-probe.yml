name: Pody/Amazon route probe (read-only)
on:
  pull_request:
    paths:
      - 'scripts/probe-pody-amazon-deep.mjs'
      - 'scripts/probe-pody-sitemap.mjs'
      - '.github/workflows/pody-amazon-probe.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg=$(git log -1 --pretty=%s HEAD^2 2>/dev/null || git log -1 --pretty=%s)
          case "$msg" in *"[pody-run]"*) ;; *) echo "skip (no [pody-run] marker)"; exit 0;; esac
          node scripts/probe-pody-sitemap.mjs docs/release/2026-11-10-show-level-urls.json ps.json || true
          split -b 50000 -d ps.json ps-part-
          for f in ps-part-*; do { echo "pody-sitemap:$f"; echo '```'; cat "$f"; echo; echo '```'; } > c.md; gh pr comment ${{ github.event.pull_request.number }} --body-file c.md; done
