name: Onsa copy readonly reconciliation
on:
  pull_request:
    paths:
      - 'tools/onsa/**'
      - 'scripts/read-onsa-workbook.py'
      - 'scripts/audit-onsa-copy.mjs'
      - 'scripts/prepare-library-search-scope.mjs'
      - 'tests/library-search-scope.test.mjs'
      - 'tests/onsa-reconciliation.test.mjs'
      - 'tests/test_onsa_reader.py'
      - '.github/workflows/onsa-readonly-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - run: node --test tests/onsa-reconciliation.test.mjs tests/platform-evidence.test.mjs tests/library-search-scope.test.mjs
      - run: python -m unittest discover -s tests -p 'test_onsa_reader.py' -v
