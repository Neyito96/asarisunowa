name: Sync listener playlists

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/sync-playlists.py"
      - ".github/workflows/sync-playlists.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-listener-playlists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Read public spreadsheet
        run: |
          python3 scripts/sync-playlists.py
          python3 scripts/sync-recommended-podcasts.py

      # ポす神回（#312/#315）: 本番GAS（type=posukamiPublic）が、管理人が「承認」にした投稿を公開シートへ移してから、
      # 公開シート（承認済み・照合済みの行だけ）と番組一覧を返す。それを public/posusume/posukami.json にする。失敗しても前回の版を残す。
      - name: Read approved Posukami sheet
        continue-on-error: true
        run: |
          node scripts/posusume/build-posukami.mjs \
            --rows "https://script.google.com/macros/s/AKfycbzwlb2aoRrCcs4zaBljBorMzWlMS3JM_6OLjrpHlY7NvMf4BLXNiNqRbhDTQVUHYqqB_A/exec?type=posukamiPublic" \
            --submit-enabled

      - name: Save changes
        run: |
          if git diff --quiet -- app/data.ts app/recommended-podcasts-data.ts public/posusume/posukami.json; then
            echo "更新はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data.ts app/recommended-podcasts-data.ts public/posusume/posukami.json
          git commit -m "朝リストをスプレッドシートから自動更新"
          git pull --rebase origin main
          git push

      - name: Deploy updated Pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
