name: Sync listener playlists

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-listener-playlists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Read repository
        uses: actions/checkout@v4

      - name: Read public spreadsheet
        run: python3 scripts/sync-playlists.py

      - name: Save changes
        run: |
          if git diff --quiet -- app/data.ts; then
            echo "更新はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data.ts
          git commit -m "朝リストをスプレッドシートから自動更新"
          git push
