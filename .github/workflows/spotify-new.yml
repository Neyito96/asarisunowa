name: Spotify new episodes
# 毎日 06:40・12:40 JST に Spotify の7番組の埋め込みページ（認証不要）を読み、docs/spotify/latest.json を更新する。
# V2 への書込はしない（清掃ロボGASの巡回 SPT が題名・日付で照合し、空欄にだけ書く）。
on:
  schedule:
    - cron: '40 21 * * *'
    - cron: '40 3 * * *'
  workflow_dispatch:
  push:   # 初回の動作確認用（main にはPRでマージ）
    branches: ['feat/spotify-new-episodes']
    paths: ['scripts/spotify/**', '.github/workflows/spotify-new.yml', 'tests/spotify-match.test.mjs']
permissions:
  contents: write
  issues: write
concurrency: { group: spotify-new, cancel-in-progress: false }
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/spotify/scrape-new.mjs
      - name: Match against V2 public ledger (read only)
        env:
          RX_URL: https://script.google.com/macros/s/AKfycbwwcQQkwhGaddZxXzWh_bPVGCVP4YssJ3FKQINmTUSsThsji334DfVtxpc9VlwSm8lRIg/exec
        run: |
          curl -fsSL "$RX_URL?type=v2PublicCsv" -o "$RUNNER_TEMP/v2.csv"
          head -c 200 "$RUNNER_TEMP/v2.csv" | grep -q '^EP-ID,' || { echo "V2・公開台帳の形ではない"; exit 1; }
          node scripts/spotify/match.mjs "$RUNNER_TEMP/v2.csv"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/spotify/latest.json docs/spotify/matches.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data(spotify): Spotify 新着 $(date -u +%F)"
          git push
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api repos/${{ github.repository }}/issues/342/comments -f body="【自動通知】Spotify 新着の取得に失敗しました（$(date -u +%FT%TZ)）。${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
