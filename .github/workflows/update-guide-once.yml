name: Update guide once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-guide-once.yml'

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update guide routing and mobile height
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/community.tsx')
          s = p.read_text()
          s = s.replace('type GuideStep = "q1" | "q2" | "q3" | "q4" | "q5" | "q6" | "q7" | "q8" | "q9" | "q10";', 'type GuideStep = "q1" | "q2" | "q3" | "q4" | "q5" | "q6" | "q7" | "q8" | "q9";')
          s = s.replace('q2: { question: "いま起きていることを、まずサッと知りたい？", choice: { yes: "朝日新聞アルキキ 最新ニュース", no: "q3" } },', 'q2: { question: "いま起きていることを、まずサッと知りたい？", choice: { yes: "ニュースの学校", no: "q3" } },')
          s = s.replace('q9: { question: "スポーツを勝った負けただけで終わらせたくない？", choice: { yes: "スポンジ Sports Lounge", no: "q10" } },\n  q10: { question: "英語が流れてきても逃げない？", choice: { yes: "朝日新聞AJW 英語ニュース", no: "OMIKUJI" } },', 'q9: { question: "スポーツを勝った負けただけで終わらせたくない？", choice: { yes: "スポンジ Sports Lounge", no: "OMIKUJI" } },')
          p.write_text(s)

          css = Path('app/globals.css')
          c = css.read_text()
          marker = '/* 2026-09-12: compact official guide on mobile */'
          if marker not in c:
              c += '''\n\n/* 2026-09-12: compact official guide on mobile */\n@media(max-width:640px){\n  .official{padding-top:8px!important;}\n  .officialHeading{margin-bottom:8px!important;}\n  .officialHeading .officialIntro{font-size:12px!important;line-height:1.35!important;}\n  .officialGuide{margin:10px 0 14px!important;padding:11px!important;border-radius:14px!important;}\n  .officialGuideTop{align-items:center!important;}\n  .officialGuideTop h3{font-size:1.05rem!important;margin:0 0 2px!important;}\n  .officialGuideTop>div>p:last-child{font-size:.78rem!important;line-height:1.35!important;}\n  .officialGuideKicker{font-size:.72rem!important;margin:0 0 1px!important;}\n  .officialGuideQuestion{margin-top:10px!important;padding:12px 9px!important;}\n  .officialGuideQuestion>p{margin:6px auto 10px!important;font-size:1rem!important;line-height:1.4!important;}\n  .officialGuideButtons{gap:8px!important;}\n  .officialGuideButtons button{min-height:42px!important;border-radius:11px!important;}\n  .officialGuideReset{padding:6px 9px!important;font-size:.76rem!important;}\n  .officialGuideResult{margin-top:10px!important;padding:11px!important;gap:10px!important;}\n  .officialGuideResult > .officialArt{width:68px!important;min-width:68px!important;height:68px!important;min-height:68px!important;flex-basis:68px!important;}\n  .officialGuideResult h4{font-size:1.05rem!important;}\n  .officialGuideResult p{font-size:.82rem!important;line-height:1.4!important;}\n  .officialGuideResultLinks{margin-top:8px!important;gap:6px!important;}\n  .officialGuideResultLinks a,.officialGuideGo{padding:7px 10px!important;font-size:.78rem!important;}\n}\n'''
              css.write_text(c)
          PY
      - name: Commit changes
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add app/community.tsx app/globals.css
          git diff --cached --quiet && exit 0
          git commit -m 'Refine official guide routing and mobile layout'
          git push
