name: Issue 231 performer playlist safety tests
on:
  pull_request:
    paths:
      - 'scripts/library-v3-playlist-*.mjs'
      - 'scripts/library-v3-spotify-*.mjs'
      - 'scripts/library-v3-search-index.mjs'
      - 'scripts/preview-library-playlist.mjs'
      - 'scripts/build-library-playlist-gas-preview.mjs'
      - 'scripts/google-apps-script/LibraryPlaylistPreview.js'
      - 'tests/library-playlist-*.test.mjs'
      - 'tests/library-spotify-diagnostics.test.mjs'
      - 'scripts/library-v3-performer-playlist-batch.mjs'
      - 'scripts/library-v3-playlist-subscription-commands.mjs'
      - 'tests/library-v3-performer-playlist-batch.test.mjs'
      - 'tests/library-v3-playlist-subscription-commands.test.mjs'
      - '.github/workflows/performer-playlist-tests.yml'
  push:
    branches:
      - 'feature/performer-playlist-shared-engine-231'
    paths:
      - 'scripts/library-v3-playlist-*.mjs'
      - 'scripts/library-v3-spotify-*.mjs'
      - 'scripts/library-v3-search-index.mjs'
      - 'scripts/preview-library-playlist.mjs'
      - 'scripts/build-library-playlist-gas-preview.mjs'
      - 'scripts/google-apps-script/LibraryPlaylistPreview.js'
      - 'tests/library-playlist-*.test.mjs'
      - 'tests/library-spotify-diagnostics.test.mjs'
      - 'scripts/library-v3-performer-playlist-batch.mjs'
      - 'scripts/library-v3-playlist-subscription-commands.mjs'
      - 'tests/library-v3-performer-playlist-batch.test.mjs'
      - 'tests/library-v3-playlist-subscription-commands.test.mjs'
      - '.github/workflows/performer-playlist-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/library-v3-performer-playlist-batch.test.mjs
      - run: node tests/library-v3-playlist-subscription-commands.test.mjs
      - run: node tests/library-v3-spotify-playlist-client.test.mjs

      - run: node --test tests/library-playlist-*.test.mjs tests/library-spotify-diagnostics.test.mjs tests/library-v3-search-index.test.mjs tests/library-v3-person-playlist-plan.test.mjs
