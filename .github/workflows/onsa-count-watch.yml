name: onsa-count-watch
# Issue #275: おんさ検索サイトの件数を6時間毎に記録（1日4回。提供者上限 1日1万アクセスを大きく下回る）。READ_ONLY。
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: { group: onsa-count-watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 前回結果を復元
        uses: actions/cache/restore@v4
        with: { path: prev, key: onsa-count-none, restore-keys: "onsa-count-" }
      - name: 集計（画面と同じ計数定義）
        id: run
        run: |
          mkdir -p prev out
          node scripts/onsa-count-watch.mjs --out out/onsa-count.json --previous prev/onsa-count.json | tee out/summary.json
      - uses: actions/upload-artifact@v4
        with: { name: onsa-count, path: out/, retention-days: 30 }
      - name: 次回用に保存
        uses: actions/cache/save@v4
        with: { path: out/onsa-count.json, key: "onsa-count-${{ github.run_id }}" }
      - name: 変化・取得失敗・監視空白をIssue #275へ記録
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          s=$(cat out/summary.json 2>/dev/null || echo '{"status":"unavailable","reason":"WORKFLOW_ERROR"}')
          if echo "$s" | grep -Eq '"status":"unavailable"|"changed":true|"monitorGap":true'; then
            gh issue comment 275 --body "おんさ件数監視 $(date -u +%FT%TZ): $s (run ${{ github.run_id }})"
          fi
