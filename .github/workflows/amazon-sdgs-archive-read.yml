name: Amazon SDGs archive read (one-off, read-only)
# 2026-11-24 管理人指示: Amazon Music の SDGsを話そう アーカイブ全回を読む。結果は Artifact に置くだけ（リポジトリ・台帳は変えない）。
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/amazon/scrape-archive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: amazon-sdgs-archive, path: out/, if-no-files-found: warn }
