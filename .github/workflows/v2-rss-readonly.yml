name: v2-rss-readonly
# 公式RSSの読取専用取得（台帳・GAS・Spotifyには触れない）。重複起動防止: [v2rss-run] を含むコミットのpushでのみ起動＋concurrency。
on:
  push:
    branches: [feat/v2-ingestion-preflight-20261111]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: v2-rss-readonly
  cancel-in-progress: false
jobs:
  fetch:
    if: contains(github.event.head_commit.message, '[v2rss-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --test tests/p25-v2-ingest.test.mjs tests/v2-leak-guard.test.mjs
      - run: node scripts/ledger-v2/fetch-official-rss.mjs 40 rss-items.json
      - run: node scripts/ledger-v2/post-rss-dump.mjs rss-items.json 306
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: 概要原文を封緘して投稿（既定は実行しない。[v2rss-sealed] を含むコミットのときだけ。本番はGASが公式RSSを直接取得する）
        if: contains(github.event.head_commit.message, '[v2rss-sealed]')
        run: |
          node scripts/ledger-v2/sealed-transfer.mjs seal rss-items.json scripts/ledger-v2/sealed-guids.json scripts/ledger-v2/sealed-transfer.pub.pem sealed.json
          node scripts/ledger-v2/sealed-transfer.mjs post sealed.json 306
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: 作業ファイルの後始末（本文入り rss-items.json を残さない）
        if: always()
        run: rm -f rss-items.json sealed.json
