name: Check GitHub Pages Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify Pages
        run: npm run build:pages

      - name: Check generated files
        run: |
          test -f dist/client/index.html
          test -f dist/client/.nojekyll
          test -d dist/client/assets
