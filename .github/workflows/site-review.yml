name: Site review
# サイト全体の不具合点検（読むだけ）。結果は ops/live-check 枝の docs/ops/site-review.json に保存。
on:
  push:
    branches: ['ops/live-check']
    paths: ['scripts/ops/site-review.mjs', '.github/workflows/site-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node scripts/ops/site-review.mjs
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add docs/ops/site-review.json && git commit -m "ops: site review $(date -u +%FT%TZ)" && git push
