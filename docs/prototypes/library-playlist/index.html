<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>図書館からプレイリストを選ぶ・未公開試作</title>
<style>body{font:16px system-ui;background:#f6f5ed;color:#163e31;max-width:880px;margin:24px auto;padding:16px}h1{font-size:1.5rem}fieldset,article{border:1px solid #c3cec4;border-radius:12px;padding:16px;margin:12px 0;background:white}label{display:inline-block;margin:6px}input,select,button{font:inherit;max-width:95%;padding:8px}button{background:#235743;color:white;border:0;border-radius:6px}p{line-height:1.6}.status{color:#755318}#list label{display:block}small{display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>図書館からプレイリストを選ぶ</h1><p>未公開の試作です。検索と候補の保存だけを行います。Spotifyへの送信・ログイン・台帳変更はありません。件数は読み込んだデータの試算です。</p>
<label>手元の図書館JSONを読む <input type="file" id="file" accept="application/json"></label><button id="demo">架空のデモで試す</button>
<fieldset><legend>検索条件</legend><label>キーワード（空白区切り）<input id="keywords" placeholder="気候 学校"></label><label>条件<select id="operator"><option>AND</option><option>OR</option></select></label><label>番組<select id="show"><option value="">すべて</option></select></label><label>確認済み出演者<input id="person"></label><label>開始日<input id="from" type="date"></label><label>終了日<input id="to" type="date"></label><button id="search">プレビュー</button></fieldset>
<p id="status" role="status">データを読み込んでください。</p><div id="list"></div><button id="more" hidden>次の50件</button>
<fieldset><legend>投稿候補</legend><label>追加先プレイリストID<input id="playlist"></label><label>新規の非公開プレイリスト名<input id="newname"></label><p>チェックしたエピソードだけが候補になります。チェックを外すと除外します。未判定・URI未確認は保留です。</p><button id="queue">選択内容を確認</button> <button id="download" disabled>候補JSONを保存</button><pre id="result"></pre></fieldset>
<script type="module" src="./preview.mjs"></script></html>
